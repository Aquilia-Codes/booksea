# Render Blueprint - lets you provision the Postgres DB + web service in one
# go from the Render dashboard ("New" -> "Blueprint", point it at this repo)
# instead of configuring each by hand. Not actually used for the current
# deploy (both resources were created manually instead - see
# docs/migration-notes.md "Render is live") but kept accurate for a future
# clean redeploy. Untested against real Render infra as a blueprint
# specifically - double-check field names against Render's current docs
# (render.com/docs/blueprint-spec) if it doesn't take.

databases:
  - name: booksea-db
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: booksea-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booksea-db
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_IDS
        value: "865744272369-atobvfr5mo0s5prs63v99rg5872ehgp2.apps.googleusercontent.com"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "15m"
      - key: JWT_REFRESH_TTL
        value: "30d"
      - key: CORS_ORIGIN
        value: "*"
